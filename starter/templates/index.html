<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern Sudoku game built with Python Flask. Features difficulty levels, timer, hints, and a Top 10 leaderboard.">
  <title>Sudoku Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <p>Generating puzzle…</p>
  </div>

  <!-- Header -->
  <header>
    <h1>Sudoku</h1>
    <button id="dark-mode-btn" title="Toggle dark/light mode">🌙</button>
  </header>

  <!-- Main Game -->
  <main>

    <!-- Top Controls Row -->
    <div class="top-controls">
      <div class="control-left">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
        <button id="new-game">New Game</button>
      </div>
      <div class="control-right">
        <span class="timer-label">Time:</span>
        <span id="timer">00:00</span>
        <button id="check-btn">Check Puzzle</button>
        <button id="hint-btn">Hint</button>
      </div>
    </div>

    <!-- Sudoku Board -->
    <div id="sudoku-board"></div>

    <!-- Number Pad (mobile) -->
    <div id="number-pad">
      <button class="num-key" data-num="1">1</button>
      <button class="num-key" data-num="2">2</button>
      <button class="num-key" data-num="3">3</button>
      <button class="num-key" data-num="4">4</button>
      <button class="num-key" data-num="5">5</button>
      <button class="num-key" data-num="6">6</button>
      <button class="num-key" data-num="7">7</button>
      <button class="num-key" data-num="8">8</button>
      <button class="num-key" data-num="9">9</button>
      <button class="num-key num-key-del" data-num="0">✕</button>
    </div>

    <!-- Game Stats -->
    <div id="game-stats">
      <span>Hints used: <strong id="hints-used">0</strong></span>
    </div>

    <!-- Top 10 Leaderboard -->
    <section id="leaderboard">
      <h2>Top 10 Fastest Times</h2>
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Time</th>
            <th>Difficulty</th>
            <th>Hints</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </section>

  </main>

  <!-- Congratulations Modal -->
  <div id="congrats-modal" class="hidden">
    <div class="modal-box">
      <div class="modal-emoji">🎉</div>
      <h2>Congratulations!</h2>
      <p>You solved the puzzle!</p>
      <div class="modal-stats">
        <div><span>Time:</span> <strong id="modal-time">—</strong></div>
        <div><span>Difficulty:</span> <strong id="modal-difficulty">—</strong></div>
        <div><span>Hints Used:</span> <strong id="modal-hints">—</strong></div>
      </div>
      <label for="player-name">Enter your name for the Top 10:</label>
      <input id="player-name" type="text" placeholder="Your name…" maxlength="20" autocomplete="off">
      <div class="modal-buttons">
        <button id="save-btn">Save Score</button>
        <button id="play-again-btn">Play Again</button>
      </div>
    </div>
  </div>

  <script src="/static/game.js"></script>
</body>
</html>
